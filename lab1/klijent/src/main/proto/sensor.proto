syntax = "proto3";

option java_multiple_files = true;
option java_package = "hr.fer.tel.rassus.examples";

package hr.fer.tel.rassus;

service Sensor {
  rpc GetReadings (ReadingsRequest) returns (ReadingsResponse);
}

message ReadingsRequest {}

message ReadingsResponse {
  optional double temperature = 1;
  optional double pressure = 2;
  optional double humidity = 3;
  optional double co = 4;
  optional double no2 = 5;
  optional double so2 = 6;
}
